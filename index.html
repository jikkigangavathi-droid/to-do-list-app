<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <p class="eyebrow">STAY ORGANIZED</p>
        <h1>My To-Do List</h1>
        <p class="subtitle">Small steps make big progress.</p>
      </div>
      <div class="check-icon" aria-hidden="true">✓</div>
    </header>

    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="200" autocomplete="off" required>
      <button type="submit" class="add-button">Add task</button>
    </form>

    <section class="task-section" aria-labelledby="tasks-heading">
      <div class="section-heading">
        <h2 id="tasks-heading">Your tasks</h2>
        <span id="task-count" class="task-count">0 tasks left</span>
      </div>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add one above to get started!</p>
    </section>

    <footer class="app-footer">
      <button id="clear-completed" class="text-button" type="button">Clear completed</button>
      <span>Saved automatically on this device</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
